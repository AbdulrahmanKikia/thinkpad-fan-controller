name: Release

on:
  push:
    tags: ["v*"]

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build the zip and the installer
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\packaging\package.ps1
      - name: Publish the GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/LibraryFan-try.zip dist/LibraryFanSetup.exe --title "${{ github.ref_name }}" --notes "ThinkPad Fan Controller Utility. The setup program downloads LibraryFan-try.zip from this release and installs LibraryFan.dll. The project was formerly called Library Fan."
